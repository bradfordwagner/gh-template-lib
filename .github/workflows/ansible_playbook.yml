name: ansible_playbook
on:
  workflow_call:
    inputs:
      version:
        description: Tag prefix for every image. Branch builds pass `latest`, tag builds pass the ref name.
        type: string
        default: latest
      config:
        description: Path to the flavor config, relative to the caller's repo root.
        type: string
        default: config.yaml
      arc:
        description: >-
          `auto` sends arm64 builds to the ARC label while the caller repo's `ARC_HOSTS` variable is set,
          `on` always does, `off` never does.
        type: string
        default: auto
      arc_runner_label:
        description: runs-on label of the ARC arm64 scale sets.
        type: string
        default: arc-arm64
      buildx_driver:
        description: >-
          buildx driver. `docker` builds on the runner's own daemon (hosted, or dind on ARC).
          `remote` with `buildx_endpoint` is the seam for a shared BuildKit.
        type: string
        default: docker
      buildx_endpoint:
        description: BuildKit address for `buildx_driver=remote`, e.g. `tcp://buildkitd.buildkit:1234`.
        type: string
        default: ''
      registry_cache:
        description: >-
          On ARC jobs only, pull docker.io and ghcr.io bases through the plain-HTTP registry pull-through caches.
          Switches the `docker` driver to `docker-container` so BuildKit can carry per-registry mirrors.
        type: boolean
        default: false
      registry_cache_dockerio:
        description: Pull-through cache for docker.io.
        type: string
        default: host.k3d.internal:5001
      registry_cache_ghcr:
        description: Pull-through cache for ghcr.io.
        type: string
        default: host.k3d.internal:5002
      buildkit_version:
        description: moby/buildkit tag for the `docker-container` driver.
        type: string
        # renovate: datasource=docker depName=moby/buildkit
        default: v0.35.1
    outputs:
      product:
        description: The build matrix, one entry per build and arch, as JSON.
        value: ${{ jobs.product.outputs.product }}
      images:
        description: The multi-arch tags the manifest job pushed, as a JSON list.
        value: ${{ jobs.manifest.outputs.images }}

permissions:
  contents: read

jobs:
  product:
    name: product
    runs-on: ubuntu-26.04
    outputs:
      product: ${{ steps.product.outputs.product }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: product
        id: product
        env:
          CONFIG: ${{ inputs.config }}
          VERSION: ${{ inputs.version }}
          ARC: ${{ inputs.arc }}
          ARC_LABEL: ${{ inputs.arc_runner_label }}
          # vars here are the caller repo's, not this repo's
          ARC_HOSTS: ${{ vars.ARC_HOSTS }}
        run: |
          set -euo pipefail
          flavor=$(yq '.flavor' "$CONFIG")
          if [ "$flavor" != ansible_playbook ]; then
            echo "::error file=$CONFIG::flavor is '$flavor'; ansible_playbook.yml builds only 'ansible_playbook'"
            exit 1
          fi
          case "$ARC" in
            auto) if [ -n "${ARC_HOSTS:-}" ]; then arc_on=true; else arc_on=false; fi ;;
            on) arc_on=true ;;
            off) arc_on=false ;;
            *) echo "::error::arc must be auto, on or off, got '$ARC'"; exit 1 ;;
          esac

          # yaml.v2 decodes any scalar into a string field as its source text: tag 6.6 stays "6.6"
          config_json=$(yq -o=json '(.. | select(tag == "!!int" or tag == "!!float" or tag == "!!bool")) |= to_string' "$CONFIG")

          product=$(jq -c --arg version "$VERSION" --argjson arc "$arc_on" --arg arc_label "$ARC_LABEL" '
            (.target_repo // "") as $target_repo
            | "\(.upstream.repo // ""):\(.upstream.tag // "")" as $upstream
            | [ (.builds // [])[] as $b | ($b.archs // [])[] as $a | {b: $b, a: ($a // "")} ]
            | to_entries
            | map(
                .key as $i | .value.a as $arch
                | (.value.b.os // "") as $os
                | {
                    arch: $arch,
                    os: $os,
                    runner: (if $arch == "linux/arm64"
                             then (if $arc then $arc_label else "ubuntu-26.04-arm" end)
                             else "ubuntu-26.04" end),
                    target_image: "\($target_repo):\($version)-\($os)",
                    upstream_image: "\($upstream)-\($os)",
                    index: $i,
                    display: "\($i):\($os)-\($version)(\($arch))"
                  })
            | if length == 0 then null else . end
          ' <<<"$config_json" | sed -e 's/&/\\u0026/g' -e 's/</\\u003c/g' -e 's/>/\\u003e/g')

          echo "product=$product" >> "$GITHUB_OUTPUT"
          jq . <<<"$product"

  builds:
    name: ${{ matrix.product.display }}
    needs: product
    runs-on: ${{ matrix.product.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        product: ${{ fromJSON(needs.product.outputs.product) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # another job on a shared runner logging out would drop our credentials
      # https://github.com/docker/login-action/issues/173#issuecomment-1079688020
      - name: Set DOCKER_CONFIG
        run: |
          id=docker_configs/${RANDOM}
          mkdir -p "$HOME/${id}/.docker"
          echo "DOCKER_CONFIG=$HOME/${id}/.docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        name: login=ghcr.io
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: false
      - name: buildx=config
        id: buildx
        env:
          DRIVER: ${{ inputs.buildx_driver }}
          ENDPOINT: ${{ inputs.buildx_endpoint }}
          ON_ARC: ${{ matrix.product.runner == inputs.arc_runner_label }}
          REGISTRY_CACHE: ${{ inputs.registry_cache }}
          CACHE_DOCKERIO: ${{ inputs.registry_cache_dockerio }}
          CACHE_GHCR: ${{ inputs.registry_cache_ghcr }}
          BUILDKIT_VERSION: ${{ inputs.buildkit_version }}
        run: |
          set -euo pipefail
          driver=$DRIVER
          config=''
          opts=''
          if [ "$REGISTRY_CACHE" = true ] && [ "$ON_ARC" = true ] && [ "$driver" != remote ]; then
            driver=docker-container
            config=$(printf '[registry."%s"]\n  mirrors = ["%s"]\n[registry."%s"]\n  http = true\n' \
              docker.io "$CACHE_DOCKERIO" "$CACHE_DOCKERIO" \
              ghcr.io "$CACHE_GHCR" "$CACHE_GHCR")
          fi
          # hosted daemons keep the classic image store and push Docker v2; BuildKit pushes OCI like ARC's dind
          if [ "$driver" = docker ] && [ "$ON_ARC" != true ]; then
            driver=docker-container
          fi
          if [ "$driver" = docker-container ]; then
            opts=$(printf 'image=moby/buildkit:%s\nnetwork=host' "$BUILDKIT_VERSION")
          fi
          if [ "$driver" = remote ] && [ -z "$ENDPOINT" ]; then
            echo "::error::buildx_driver=remote needs buildx_endpoint"
            exit 1
          fi
          {
            echo "driver=$driver"
            echo "endpoint=$ENDPOINT"
            echo "opts<<EOF"
            echo "$opts"
            echo "EOF"
            echo "config<<EOF"
            echo "$config"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: steps.buildx.outputs.driver != 'docker'
        with:
          driver: ${{ steps.buildx.outputs.driver }}
          endpoint: ${{ steps.buildx.outputs.endpoint }}
          driver-opts: ${{ steps.buildx.outputs.opts }}
          buildkitd-config-inline: ${{ steps.buildx.outputs.config }}
      - name: dockerfile
        id: dockerfile
        env:
          UPSTREAM: ${{ matrix.product.upstream_image }}
        run: |
          set -euo pipefail
          # no WORKDIR: Dagger ran these in the upstream image's own WORKDIR (/src in ghcr.io/bradfordwagner/ansible),
          # so the relative paths resolve to the copied files, merged over whatever the upstream left in /src
          {
            echo "FROM $UPSTREAM"
            echo "COPY . /src"
            for f in requirements.yml meta/requirements.yml; do
              if [ -f "$f" ]; then echo "RUN [\"ansible-galaxy\", \"install\", \"-r\", \"$f\"]"; fi
            done
            for f in test.yml playbook.yml; do
              if [ -f "$f" ]; then echo "RUN [\"ansible-playbook\", \"$f\"]"; fi
            done
          } > "$RUNNER_TEMP/Dockerfile"
          printf '.git\n' > "$RUNNER_TEMP/Dockerfile.dockerignore"
          cat "$RUNNER_TEMP/Dockerfile"
      - name: build=${{ matrix.product.arch }}
        env:
          TARGET: ${{ matrix.product.target_image }}
          ARCH: ${{ matrix.product.arch }}
        run: |
          set -euo pipefail
          # provenance/sbom off keeps each per-arch tag a single manifest, as the Dagger module pushed
          docker buildx build \
            --platform "$ARCH" \
            --file "$RUNNER_TEMP/Dockerfile" \
            --provenance=false \
            --sbom=false \
            --output "type=image,push=true,oci-mediatypes=true" \
            --tag "$TARGET-${ARCH//\//_}" \
            .

  manifest:
    name: manifest
    needs: [product, builds]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    outputs:
      images: ${{ steps.manifest.outputs.images }}
    steps:
      - name: Set DOCKER_CONFIG
        run: |
          id=docker_configs/${RANDOM}
          mkdir -p "$HOME/${id}/.docker"
          echo "DOCKER_CONFIG=$HOME/${id}/.docker" >> "$GITHUB_ENV"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        name: login=ghcr.io
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
          logout: false
      - name: manifest
        id: manifest
        env:
          PRODUCT: ${{ needs.product.outputs.product }}
        run: |
          set -euo pipefail
          groups=$(jq -c '
            reduce .[] as $p ([];
              if any(.[]; .image == $p.target_image)
              then map(if .image == $p.target_image then .archs += [$p.arch] else . end)
              else . + [{image: $p.target_image, archs: [$p.arch]}] end)
            | map(.archs |= unique)' <<<"$PRODUCT")
          while read -r group; do
            image=$(jq -r .image <<<"$group")
            mapfile -t sources < <(jq -r --arg image "$image" '.archs[] | "\($image)-\(gsub("/"; "_"))"' <<<"$group")
            docker buildx imagetools create --tag "$image" "${sources[@]}"
          done < <(jq -c '.[]' <<<"$groups")
          echo "images=$(jq -c 'map(.image)' <<<"$groups")" >> "$GITHUB_OUTPUT"
