name: ci
on:
  push:
    branches:
      - '**'
  pull_request: {}

permissions:
  contents: read

jobs:
  lint:
    name: lint
    runs-on: ubuntu-24.04
    env:
      # renovate: datasource=github-releases depName=rhysd/actionlint extractVersion=^v(?<version>.*)$
      ACTIONLINT_VERSION: 1.7.12
      # renovate: datasource=pypi depName=yamllint
      YAMLLINT_VERSION: 1.38.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: yamllint
        run: pipx run "yamllint==${YAMLLINT_VERSION}" --strict .
      - name: actionlint
        run: |
          set -euo pipefail
          base=https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}
          tarball=actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz
          curl -sSfLO "$base/$tarball"
          curl -sSfLO "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $tarball\$" "actionlint_${ACTIONLINT_VERSION}_checksums.txt" | sha256sum -c -
          tar xzf "$tarball" actionlint
          ./actionlint -color
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: mirror product
        run: ./test/mirror-product.sh
      - name: ansible_playbook product
        run: ./test/ansible_playbook-product.sh
